schema_version: zeromodel-demo/v1
id: state-chooses-the-pixel
title: State Chooses the Pixel
class: demo
status: prototype
summary: Browser state compiles to a coordinate in a visual policy image, decodes the sampled colour into a deterministic action, and supports reverse inspection of compatible states.

zeromodel:
  repository: https://github.com/ernanhughes/zeromodel
  version: null
  commit: null
  packages: []

runtime:
  language: javascript
  version: browser-es2021
  entrypoint: index.html
  network_required: false
  external_services: []

presentation:
  website_visible: true
  featured: true
  route: /demos/state-chooses-the-pixel/
  thumbnail: policy.svg
  screenshots: []

claims:
  supported:
    - Within this bounded deterministic policy, state compiles to an image coordinate and the sampled colour decodes to an action.
    - The address compiler deliberately maps critical threat with low energy and critical threat with ready energy to the same retreat cell.
    - Critical threat with empty energy is remapped to its own adjacent cell so the retreat cell demonstrates a two-state equivalence class.
    - Clicking a policy cell derives the compatible states by enumerating the bounded state space with the same forward address-compilation logic.
    - Reverse inspection demonstrates unique cells, one multiple-state equivalence class, and one unreachable cell.
    - The browser runtime requires no model inference, prompt, API call, or Python execution.
  limitations:
    - The introductory 4x4 policy is hand-authored for explanation rather than generated by the current ZeroModel compiler.
    - The demonstration does not establish learning, open-world perception, or general intelligence.
    - Reverse inspection is exhaustive only for the small state space declared in the manifest.
  claims_to_avoid:
    - The browser image learns or reasons autonomously.
    - This demonstration validates arbitrary policies or domains.

provenance:
  claims_audit: null
  frozen_results: []
  research_documents: []

validation:
  install_command: null
  run_command: python -m http.server 8080
  test_command: null
  expected_artifacts:
    - policy.svg
    - policy.json

promotion:
  source_item: null
  target_class: showcase
  review_notes: Replace the hand-authored policy with a ZeroModel-generated artifact before promoting the mechanism as a core-generated showcase.
