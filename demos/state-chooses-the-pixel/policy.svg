<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <title>ZeroModel introductory visual policy</title>
  <desc>A 4 by 4 executable policy image. Columns encode energy; rows encode threat.</desc>
  <rect width="512" height="512" fill="#111827"/>

  <!-- threat 0 -->
  <rect x="0" y="0" width="128" height="128" fill="#6b7280"/>
  <rect x="128" y="0" width="128" height="128" fill="#22c55e"/>
  <rect x="256" y="0" width="128" height="128" fill="#22c55e"/>
  <rect x="384" y="0" width="128" height="128" fill="#22c55e"/>

  <!-- threat 1 -->
  <rect x="0" y="128" width="128" height="128" fill="#eab308"/>
  <rect x="128" y="128" width="128" height="128" fill="#3b82f6"/>
  <rect x="256" y="128" width="128" height="128" fill="#ef4444"/>
  <rect x="384" y="128" width="128" height="128" fill="#ef4444"/>

  <!-- threat 2 -->
  <rect x="0" y="256" width="128" height="128" fill="#eab308"/>
  <rect x="128" y="256" width="128" height="128" fill="#a855f7"/>
  <rect x="256" y="256" width="128" height="128" fill="#ef4444"/>
  <rect x="384" y="256" width="128" height="128" fill="#ef4444"/>

  <!-- threat 3 -->
  <rect x="0" y="384" width="128" height="128" fill="#eab308"/>
  <rect x="128" y="384" width="128" height="128" fill="#a855f7"/>
  <rect x="256" y="384" width="128" height="128" fill="#a855f7"/>
  <rect x="384" y="384" width="128" height="128" fill="#ef4444"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <path d="M128 0V512M256 0V512M384 0V512"/>
    <path d="M0 128H512M0 256H512M0 384H512"/>
  </g>
</svg>
