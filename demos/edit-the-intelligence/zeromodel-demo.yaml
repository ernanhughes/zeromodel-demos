id: edit-the-intelligence
title: Edit the Intelligence
class: demo
priority: launch
staircase_step: 2
status: prototype
summary: >-
  Repaint the visual policy cell selected by a fixed state and replay the
  decision to show that changing the image changes the action while the
  browser reader and state remain unchanged.

question: >-
  Can a visitor change a deterministic decision by changing only the visual
  policy artifact?

runtime:
  type: static-browser
  requires_backend: false
  requires_model: false
  requires_python_package: false
  files:
    - index.html
    - demo.css
    - demo.js
    - policy.svg
    - policy.json

inputs:
  - threat
  - energy
  - selected replacement action

outputs:
  - selected policy cell
  - original encoded colour and action
  - edited encoded colour and action
  - before/after decision comparison

claims:
  demonstrates:
    - The browser calculates a deterministic address from state.
    - The image cell supplies the encoded action.
    - Editing that cell changes the replayed decision without changing the reader.
    - The complete experience runs as a static web bundle.
  does_not_demonstrate:
    - That this explanatory policy was generated by the current ZeroModel compiler.
    - That arbitrary intelligent behaviour can be safely changed by editing one pixel.
    - Persistent policy authoring or governed promotion.

extension_path:
  previous: state-chooses-the-pixel
  next: transition-evidence
  future:
    - export an edited policy image
    - compare two content-addressed policy versions
    - validate edits against a policy contract
    - use an editable policy to control the shooter opponent

hugo:
  destination: static/demos/edit-the-intelligence/
  preferred_embed: iframe
